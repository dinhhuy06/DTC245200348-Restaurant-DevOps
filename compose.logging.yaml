services:
  nginx:
    volumes:
      - nginx_logs:/var/log/restaurant

  loki:
    image: grafana/loki:3.5.1
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - backend

  promtail:
    image: grafana/promtail:3.5.0
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - nginx_logs:/var/log/restaurant:ro
      - promtail_positions:/positions
    depends_on:
      - loki
      - nginx
    networks:
      - backend

volumes:
  nginx_logs:
  loki_data:
  promtail_positions: